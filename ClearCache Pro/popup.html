<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearCache Pro</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    /* Keep html matching body background to stop white corner flashes */
    html, body {
      width: 320px;
      background-color: #0f172a; 
      color: #f8fafc;
    }

    /* Wrap contents inside a padded outer wrapper with border-radius */
    .app-card {
      padding: 16px;
      background-color: #0f172a;
      border-radius: 12px;
    }

    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .space-x-2 > * + * { margin-left: 8px; }
    .space-y-1 > * + * { margin-top: 4px; }
    .text-bold { font-weight: 700; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 14px; }
    .text-muted { color: #94a3b8; font-size: 11px; }

    .btn-primary { 
      width: 100%; 
      background: #4f46e5; 
      color: white; 
      border: none; 
      font-weight: 600; 
      cursor: pointer; 
      border-radius: 8px; 
      padding: 10px; 
      margin: 12px 0; 
      transition: background 0.2s; 
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { background: #334155; cursor: not-allowed; }

    select, input[type="text"] { 
      width: 100%; 
      background: #1e293b; 
      border: 1px solid #334155; 
      color: white; 
      padding: 6px 8px; 
      border-radius: 6px; 
      font-size: 12px; 
      outline: none; 
    }

    .checkbox-list { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      margin: 12px 0; 
      background: #1e293b; 
      padding: 10px; 
      border-radius: 8px; 
    }

    .checkbox-item { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      font-size: 12px; 
      cursor: pointer; 
    }
    .checkbox-item input { accent-color: #4f46e5; cursor: pointer; }

    .whitelist-section { 
      border-top: 1px solid #334155; 
      padding-top: 10px; 
      margin-top: 10px; 
    }

    .input-row { display: flex; gap: 6px; margin-top: 4px; }

    .btn-add { 
      background: #4f46e5; 
      border: none; 
      color: white; 
      padding: 0 12px; 
      border-radius: 6px; 
      font-size: 12px; 
      cursor: pointer; 
    }

    .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .tag { 
      background: #334155; 
      font-size: 11px; 
      padding: 2px 8px; 
      border-radius: 6px; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
    }

    .tag button { background: none; border: none; color: #94a3b8; cursor: pointer; font-weight: bold; }
    .tag button:hover { color: #ef4444; }
  </style>
</head>
<body>
  <div class="app-card">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div>
          <h1 class="text-sm text-bold">ClearCache <span style="color: #818cf8;">Pro</span></h1>
          <p class="text-muted">Browser Data Cleaner</p>
        </div>
      </div>
    </div>

    <!-- Quick Clear Button -->
    <button id="btn-quick-clear" class="btn-primary">Quick Clear Now</button>

    <!-- Time Range -->
    <div class="space-y-1">
      <label class="text-muted" style="font-weight:600; text-transform:uppercase;">Time Range</label>
      <select id="time-range">
        <option value="hour">Last Hour</option>
        <option value="24h" selected>Last 24 Hours</option>
        <option value="7d">Last 7 Days</option>
        <option value="4w">Last 4 Weeks</option>
        <option value="everything">All Time</option>
      </select>
    </div>

    <!-- Options Checkboxes -->
    <div class="checkbox-list">
      <label class="checkbox-item"><span>Cached Images & Files</span><input type="checkbox" id="chk-cache" checked></label>
      <label class="checkbox-item"><span>Cookies & Site Data</span><input type="checkbox" id="chk-cookies" checked></label>
      <label class="checkbox-item"><span>Local Storage</span><input type="checkbox" id="chk-localStorage" checked></label>
      <label class="checkbox-item"><span>Browsing History</span><input type="checkbox" id="chk-history" checked></label>
      <label class="checkbox-item"><span>Download History</span><input type="checkbox" id="chk-downloads"></label>
      <label class="checkbox-item"><span>Form Autofill</span><input type="checkbox" id="chk-formData"></label>
      <label class="checkbox-item"><span>Passwords</span><input type="checkbox" id="chk-passwords"></label>
    </div>

    <!-- Domain Whitelist -->
    <div class="whitelist-section">
      <label class="text-muted" style="font-weight:600; text-transform:uppercase;">Protected Whitelist</label>
      <div class="input-row">
        <input type="text" id="whitelist-input" placeholder="e.g. github.com">
        <button id="btn-add-whitelist" class="btn-add">Add</button>
      </div>
      <div id="whitelist-list" class="tags-container"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
